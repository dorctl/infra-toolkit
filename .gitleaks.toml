# gitleaks configuration for infra-toolkit
# Default rules (keys, tokens, passwords) plus rules for customer network data.
# Picked up automatically by gitleaks and by the CI workflow.

title = "infra-toolkit"

[extend]
useDefault = true

[[rules]]
id = "private-ipv4"
description = "Private IPv4 address (RFC 1918) - customer network data. Use 192.0.2.x / 198.51.100.x / 203.0.113.x in examples."
regex = '''(?:^|[^0-9.])(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})(?:[^0-9]|$)'''
tags = ["customer-data"]

[[rules]]
id = "internal-domain"
description = "Internal domain name (.local / .corp / .lan / .intra / .internal) - customer data. Use contoso.com / example.com."
regex = '''(?i)[a-z0-9-]\.(local|corp|lan|intra|internal)(?:[^a-z0-9-]|$)'''
tags = ["customer-data"]

[allowlist]
description = "This file documents the rules itself"
paths = [
    '''^\.gitleaks\.toml$''',
]
