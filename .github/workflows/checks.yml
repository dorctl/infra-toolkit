name: checks

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret and customer-data scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The gitleaks CLI scans the full history on every run. gitleaks-action scanned only the pushed range
      # (<first pushed commit>^..<head>), which fails on a push that contains the root commit.
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${file}\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$file" checksums.txt gitleaks
          gitleaks version

      - name: Scan full history
        run: gitleaks git --redact --verbose --no-banner --config .gitleaks.toml .

      # A merge made by GitHub (button or API) can record the account email as committer.
      # Only the commit IDs are printed, so the log does not repeat the address.
      - name: Commit emails are GitHub noreply addresses
        run: |
          bad=$(git log --all --format='%H %ae %ce' | awk '{
            for (i = 2; i <= 3; i++)
              if ($i !~ /@users\.noreply\.github\.com$/ && $i != "noreply@github.com") { print $1; break }
          }')
          if [ -n "$bad" ]; then
            echo "::error::Commits with an email that is not a GitHub noreply address:"
            echo "$bad"
            exit 1
          fi
          echo "All commit emails are GitHub noreply addresses"

  powershell:
    name: Lint and tests (PowerShell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install PSScriptAnalyzer and Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer, Pester -Scope CurrentUser -Force -SkipPublisherCheck

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File -Include *.ps1, *.psm1, *.psd1 |
            Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }
          $results = $files | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_.FullName -Settings ./.github/PSScriptAnalyzerSettings.psd1
          }
          if ($results) {
            $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap
            throw "PSScriptAnalyzer found $(@($results).Count) issue(s)"
          }
          Write-Host "PSScriptAnalyzer: $($files.Count) files clean"

      - name: Pester
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem -Recurse -File -Filter *.Tests.ps1)
          if ($tests.Count -eq 0) { Write-Host 'No Pester tests found'; exit 0 }
          $config = New-PesterConfiguration
          $config.Run.Path = $tests.FullName
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
